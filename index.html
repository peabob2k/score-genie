<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Game Score Genie</title>
<meta name="application-name" content="Game Score Genie">
<meta name="description" content="Keep score at the table for Mexican Train, Hand & Foot, Oh Heck, Golf, Rummy, Spades and Cribbage. Made by Bob Peacock.">
<meta name="author" content="Bob Peacock">
<meta name="apple-mobile-web-app-title" content="Game Score Genie">

<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
body{margin:0;background:#173b2c}
.bar{background:#173b2c;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px;display:flex;justify-content:center}
.bar{position:relative}
.pick-btn{display:flex;align-items:center;gap:8px;width:100%;max-width:480px;border:0;border-radius:999px;background:rgba(0,0,0,.28);color:#f4efe4;padding:7px 14px;font:600 14px/1.1 Barlow,system-ui,-apple-system,sans-serif;cursor:pointer;text-align:left}
.pick-btn .pick-app{font-weight:500;font-size:12px;opacity:.7;white-space:nowrap}
.pick-btn .pick-name{flex:1;font-size:15px}
.pick-btn:focus-visible,.pick-list button:focus-visible{outline:3px solid #e9c46a;outline-offset:2px}
.pick-list{position:absolute;left:12px;right:12px;top:calc(100% - 2px);max-width:480px;margin:0 auto;background:#fbf8f2;color:#1d1b19;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);padding:4px;z-index:100;display:flex;flex-direction:column}
.pick-list[hidden]{display:none}
.pick-list button{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:10px 12px;border-radius:8px;font:600 15px Barlow,system-ui,sans-serif;color:#1d1b19;cursor:pointer}
.pick-list button small{display:block;font-weight:400;font-size:12px;color:#5b7169;margin-top:2px}
.pick-list button[aria-checked="true"]{background:#e4ece7}
.pick-list .pick-ico{flex:none;width:28px;height:28px;color:#1f6b52}
.pick-list .pick-txt{flex:1}
.pick-cur{display:inline-flex;width:20px;height:20px;flex:none}
.pick-credit{margin:4px 12px 6px;padding-top:8px;border-top:1px solid #e2e8e4;font:500 12px Barlow,system-ui,sans-serif;color:#5b7169;text-align:center}
.pick-cur .pick-ico{width:20px;height:20px}
.pick-list button[aria-checked="true"]::after{content:"✓";color:#1f6b52;font-weight:700}
.pick-list button:hover{background:#eef3f0}
.host{display:block}
.host[hidden]{display:none!important}
.ask-wrap{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.ask-wrap[hidden]{display:none}
.ask-scrim{position:absolute;inset:0;background:rgba(6,20,16,.55)}
.ask-box{position:relative;background:#fbf8f2;color:#14302A;border-radius:16px;padding:18px;max-width:340px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35);font-family:Barlow,system-ui,-apple-system,sans-serif}
.ask-box p{margin:0 0 16px;font-size:17px;line-height:1.35;font-weight:500}
.ask-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ask-actions button{border:none;border-radius:12px;padding:13px;font:600 16px Barlow,system-ui,sans-serif;cursor:pointer}
#askNo{background:transparent;color:#14302A;box-shadow:inset 0 0 0 1px #C9D7D0}
#askYes{background:#1F6B52;color:#fff}
#askYes.danger{background:#B3261E}
.vbox{max-width:380px}
.vrow{display:flex;flex-direction:column;gap:6px;margin:0 0 14px;font-weight:600;font-size:15px}
.vrow span{font-weight:500;color:#5b7169}
.vrow select{font:500 15px Barlow,system-ui,sans-serif;padding:10px;border-radius:10px;border:1px solid #C9D7D0;background:#fff;color:#14302A}
.vrow input[type=range]{width:100%;accent-color:#1F6B52}
.vrow input[type=text]{font:500 16px Barlow,system-ui,sans-serif;padding:10px;border-radius:10px;border:1px solid #C9D7D0;background:#fff;color:#14302A}
@media (prefers-color-scheme: dark){.vrow input[type=text]{background:#0E211B;color:#E7F0EB;border-color:#284840}}
.vnote{font-size:13px!important;font-weight:400!important;color:#5b7169;margin:0 0 14px!important}
#voiceTest{background:transparent;color:#14302A;box-shadow:inset 0 0 0 1px #C9D7D0}
#voiceDone{background:#1F6B52;color:#fff}
@media (prefers-color-scheme: dark){.vrow select{background:#0E211B;color:#E7F0EB;border-color:#284840} #voiceTest{color:#E7F0EB;box-shadow:inset 0 0 0 1px #284840} .vrow span,.vnote{color:#93AAA1}}
.ask-actions button:focus-visible{outline:3px solid #e9c46a;outline-offset:2px}
@media (prefers-color-scheme: dark){.ask-box{background:#16302A;color:#E7F0EB} #askNo{color:#E7F0EB;box-shadow:inset 0 0 0 1px #284840}}
.fx-toast{position:fixed;left:50%;top:calc(56px + env(safe-area-inset-top,0px));transform:translate(-50%,-12px);max-width:calc(100% - 32px);background:#14302A;color:#fff;padding:10px 18px;border-radius:999px;font:600 15px Barlow,system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:950;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;text-align:center}
.fx-toast.show{opacity:1;transform:translate(-50%,0)}
.fx-toast[hidden]{display:none}
.fx-confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:940}
.pick-list .pick-fx{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 8px 0;padding-top:8px;border-top:1px solid #e2e8e4}
.pick-list .fx-tg{display:inline-flex;border:1px solid #C9D7D0;background:transparent;color:#14302A;border-radius:999px;padding:6px 11px;font:600 13px Barlow,system-ui,sans-serif}
.pick-list .fx-tg[aria-pressed="true"]{background:#1F6B52;border-color:#1F6B52;color:#fff}
.pick-list .fx-tg[aria-pressed="true"]::after,.pick-list .fx-tg::after{content:none}
@media print{.bar,.ask-wrap,.fx-toast{display:none!important} body{background:#fff}}
</style>
</head>
<body>

    <button type="button" role="menuitemradio" data-game="golf"><svg class="pick-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.2c-1.9 2-4 3.4-4 5.3 0 1.3 1 2.2 2.2 2.2.6 0 1.1-.2 1.4-.6-.1 1-.5 1.8-1.2 2.4h3.2c-.7-.6-1.1-1.4-1.2-2.4.3.4.8.6 1.4.6 1.2 0 2.2-.9 2.2-2.2 0-1.9-2.1-3.3-4-5.3z" fill="currentColor"/></svg><span class="pick-txt">Golf<small>Cards · 4-card or 6-card</small></span></button>
    <button type="button" role="menuitemradio" data-game="rummy"><svg class="pick-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.2c-1.9 2-4 3.4-4 5.3 0 1.3 1 2.2 2.2 2.2.6 0 1.1-.2 1.4-.6-.1 1-.5 1.8-1.2 2.4h3.2c-.7-.6-1.1-1.4-1.2-2.4.3.4.8.6 1.4.6 1.2 0 2.2-.9 2.2-2.2 0-1.9-2.1-3.3-4-5.3z" fill="currentColor"/></svg><span class="pick-txt">Rummy<small>Cards · race to a target</small></span></button>
    <button type="button" role="menuitemradio" data-game="spades"><svg class="pick-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.2c-1.9 2-4 3.4-4 5.3 0 1.3 1 2.2 2.2 2.2.6 0 1.1-.2 1.4-.6-.1 1-.5 1.8-1.2 2.4h3.2c-.7-.6-1.1-1.4-1.2-2.4.3.4.8.6 1.4.6 1.2 0 2.2-.9 2.2-2.2 0-1.9-2.1-3.3-4-5.3z" fill="currentColor"/></svg><span class="pick-txt">Spades<small>Cards · bid and take tricks, 2–4 players</small></span></button>
    <button type="button" role="menuitemradio" data-game="crib"><svg class="pick-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.2c-1.9 2-4 3.4-4 5.3 0 1.3 1 2.2 2.2 2.2.6 0 1.1-.2 1.4-.6-.1 1-.5 1.8-1.2 2.4h3.2c-.7-.6-1.1-1.4-1.2-2.4.3.4.8.6 1.4.6 1.2 0 2.2-.9 2.2-2.2 0-1.9-2.1-3.3-4-5.3z" fill="currentColor"/></svg><span class="pick-txt">Cribbage<small>Cards · peg board and hand counter</small></span></button>
    <div class="pick-fx" role="group" aria-label="Sound and feedback">
      <button type="button" class="fx-tg" data-fx="sound" aria-pressed="true">🔊 Sound</button>
      <button type="button" class="fx-tg" data-fx="vibe" aria-pressed="true">📳 Vibrate</button>
      <button type="button" class="fx-tg" data-fx="voice" aria-pressed="true">🗣️ Voice</button>
      <button type="button" class="fx-tg" id="voiceSetBtn">⚙️ Voice settings</button>
    </div>
    <p class="pick-credit">Game Score Genie · made by Bob Peacock</p>
  </div>
</div>
<div class="fx-toast" id="fxToast" role="status" aria-live="polite" hidden></div>
<div class="ask-wrap" id="voiceWrap" hidden><div class="ask-scrim" id="voiceScrim"></div>
  <div class="ask-box vbox" role="dialog" aria-modal="true" aria-labelledby="voiceTitle">
    <p id="voiceTitle"><b>Voice settings</b></p>
    <label class="vrow">Voice<select id="voiceSel"></select></label>
    <label class="vrow">Speed <span id="rateVal"></span><input type="range" id="voiceRate" min="0.7" max="1.3" step="0.05"></label>
    <label class="vrow">Pitch <span id="pitchVal"></span><input type="range" id="voicePitch" min="0.7" max="1.4" step="0.05"></label>

    <div class="ask-actions"><button type="button" id="voiceTest">▶ Try it</button><button type="button" id="voiceDone">Done</button></div>
  </div>
</div>
<div class="ask-wrap" id="askWrap" hidden><div class="ask-scrim"></div><div class="ask-box" role="alertdialog" aria-modal="true" aria-labelledby="askMsg"><p id="askMsg"></p><div class="ask-actions"><button type="button" id="askNo">Cancel</button><button type="button" id="askYes">OK</button></div></div></div>

<div class="host" id="host-hf" hidden></div>
<div class="host" id="host-oh" hidden></div>
<div class="host" id="host-golf" hidden></div>
<div class="host" id="host-rummy" hidden></div>
<div class="host" id="host-spades" hidden></div>
<div class="host" id="host-crib" hidden></div>

<template id="tpl-mt"><style>
:host{
  --bg:#E4ECE7; --surface:#FFFFFF; --ink:#14302A; --muted:#5B7169; --line:#C9D7D0;
  --felt:#1F6B52; --felt-ink:#FFFFFF; --tile:#FBFAF6; --tile-ink:#14302A; --pip:#B3261E;
  --gold:#E0A526; --gold-soft:#FBEFCF; --now:#D7EBE1;
  --shadow:0 1px 0 rgba(20,48,42,.12), 0 2px 6px rgba(20,48,42,.08);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :host{
    --bg:#0E211B; --surface:#16302A; --ink:#E7F0EB; --muted:#93AAA1; --line:#284840;
    --felt:#2E8F6E; --felt-ink:#FFFFFF; --tile:#EDEBE3; --tile-ink:#14302A; --pip:#B3261E;
    --gold:#E9B444; --gold-soft:#3A3318; --now:#1D3D34;
    --shadow:0 1px 0 rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:host([data-theme="dark"]){
  --bg:#0E211B; --surface:#16302A; --ink:#E7F0EB; --muted:#93AAA1; --line:#284840;
  --felt:#2E8F6E; --felt-ink:#FFFFFF; --tile:#EDEBE3; --tile-ink:#14302A; --pip:#B3261E;
  --gold:#E9B444; --gold-soft:#3A3318; --now:#1D3D34;
  --shadow:0 1px 0 rgba(0,0,0,.4);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.app{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-family:"Barlow Condensed",Barlow,system-ui,sans-serif;font-variant-numeric:tabular-nums}

.wrap{max-width:560px;margin:0 auto;padding:8px 14px 140px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px}
h1{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:20px;line-height:1;margin:0;letter-spacing:.2px}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:500;font-size:12px;color:var(--muted)}

.grid{display:grid;grid-template-columns:64px repeat(3,1fr);gap:6px;align-items:stretch}
.names input{width:100%;min-width:0;border:none;border-bottom:2px solid var(--line);background:transparent;padding:6px 2px;font-weight:600;font-size:17px;text-align:center;border-radius:0}
.names input:focus{outline:none;border-bottom-color:var(--felt)}
.names{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:6px 0 8px}
.app::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}

/* Round tile: a double domino */
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;width:40px;margin:0 auto;background:var(--tile);color:var(--tile-ink);border-radius:7px;box-shadow:inset 0 0 0 1.5px rgba(20,48,42,.35);height:100%;min-height:58px}
.tile span{flex:1;display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;line-height:1;width:100%}
.tile i{display:block;width:70%;height:1.5px;background:rgba(20,48,42,.35)}
button.tile{border:none;padding:0;font:inherit;cursor:pointer}
button.tile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row.now .tile{box-shadow:inset 0 0 0 2px var(--pip)}
.row.now .tile span{color:var(--pip)}

.cell{width:100%;min-height:58px;border:none;border-radius:10px;background:var(--surface);box-shadow:var(--shadow);font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.cell small{font-family:Barlow,sans-serif;font-size:11px;font-weight:500;color:var(--muted);margin-top:3px}
.cell.empty{color:var(--muted);font-size:15px;font-weight:500;font-family:Barlow,sans-serif;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.row.now .cell.empty{background:var(--now);box-shadow:none;color:var(--ink)}
.cell.zero{color:var(--felt)}
.row{margin-bottom:6px}

/* Totals */
.totals{position:fixed;left:0;right:0;bottom:0;background:var(--felt);color:var(--felt-ink);padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:20}
.totals .grid{max-width:532px;margin:0 auto}
.totals .lbl{font-size:13px;font-weight:500;align-self:center;text-align:center;opacity:.85;line-height:1.15}
.tot{text-align:center;border-radius:10px;padding:6px 2px}
.tot b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:32px;font-weight:700;line-height:1}
.tot span{display:block;font-size:12px;opacity:.85;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tot.lead{background:var(--gold);color:#2A1E00}
.tot.lead span{opacity:1}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(6,20,16,.5);z-index:30;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:18px 18px 0 0;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;transform:translateY(105%);transition:transform .22s ease;max-height:92vh;max-height:92dvh;overflow:auto}
.open .scrim{display:block}
.open .sheet{transform:none}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sheet h2{margin:0;font-size:15px;font-weight:600}
.sheet .sub{color:var(--muted);font-size:13px}
.readout{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 2px;border-bottom:1px solid var(--line);padding-bottom:6px}
.readout b{font-family:"Barlow Condensed",sans-serif;font-size:40px;font-weight:700;line-height:.9}
.trail{color:var(--muted);font-size:14px;text-align:right;flex:1;min-height:20px;overflow-wrap:anywhere}
.hint{font-size:13px;color:var(--muted);margin:0}
.view{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 8px}
.seg{display:inline-flex;flex-shrink:0;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:none;background:none;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--felt);color:var(--felt-ink)}

  // ===== Game picker =====
  var GAMES = {mt:'Mexican Train', hf:'Hand & Foot', oh:'Oh Heck', golf:'Golf', rummy:'Rummy', spades:'Spades', crib:'Cribbage'};
  var pickBtn = document.getElementById('pickBtn'), pickList = document.getElementById('pickList');
  var items = pickList.querySelectorAll('[data-game]');
  function setPicker(open){ pickList.hidden = !open; pickBtn.setAttribute('aria-expanded', String(open)); if(open){ var cur = pickList.querySelector('[aria-checked="true"]'); if(cur) cur.focus(); } }
  function pickGame(g){
    Object.keys(GAMES).forEach(function(k){ document.getElementById('host-'+k).hidden = k!==g; });
    items.forEach(function(b){ b.setAttribute('aria-checked', String(b.dataset.game===g)); });
    document.getElementById('pickName').textContent = GAMES[g];
    var ic = pickList.querySelector('[data-game="'+g+'"] .pick-ico');
    document.getElementById('pickIco').innerHTML = ic ? ic.outerHTML : '';
    try{ localStorage.setItem('gamenight-game', g); }catch(e){}
    window.scrollTo(0,0);
  }
  pickBtn.addEventListener('click', function(e){ e.stopPropagation(); setPicker(pickList.hidden); });
  items.forEach(function(b){ b.addEventListener('click', function(){ pickGame(b.dataset.game); setPicker(false); pickBtn.focus(); }); });
  document.addEventListener('click', function(e){ if(!pickList.hidden && !pickList.contains(e.target) && e.target!==pickBtn) setPicker(false); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && !pickList.hidden){ setPicker(false); pickBtn.focus(); } });
  pickList.querySelectorAll('[data-fx]').forEach(function(b){
    var k = b.dataset.fx;
    if((k==='vibe' && !FX.canVibe) || (k==='voice' && !FX.canSpeak)){ b.hidden = true; return; }
    b.setAttribute('aria-pressed', String(!!FX.prefs[k]));
    b.addEventListener('click', function(e){
      e.stopPropagation();
      FX.setPref(k, !FX.prefs[k]); b.setAttribute('aria-pressed', String(FX.prefs[k]));
      if(FX.prefs[k]){ if(k==='sound') FX.play('ping'); if(k==='vibe') FX.play('tick'); if(k==='voice') FX.speak('Voice is on'); }
    });
  });
  // Voice settings
  (function(){
    var btn = document.getElementById('voiceSetBtn'), wrap = document.getElementById('voiceWrap');
    if(!FX.canSpeak){ btn.hidden = true; return; }
    var sel = document.getElementById('voiceSel'), rate = document.getElementById('voiceRate'), pitch = document.getElementById('voicePitch'), opener = null;
    function fill(){
      var vs = FX.englishVoices(), cur = FX.bestVoice();
      sel.innerHTML = vs.length ? '' : '<option value="">Phone default</option>';
      vs.forEach(function(v){ var o = document.createElement('option'); o.value = v.name; o.textContent = v.name.replace(/^Microsoft |^Google /,'')+' ('+v.lang+')'; if(cur && v.name===cur.name) o.selected = true; sel.appendChild(o); });
      rate.value = FX.prefs.rate; pitch.value = FX.prefs.pitch;
      document.getElementById('rateVal').textContent = (+FX.prefs.rate).toFixed(2)+'×';
      document.getElementById('pitchVal').textContent = (+FX.prefs.pitch).toFixed(2)+'×';
    }
    function open(){ opener = document.activeElement; fill(); wrap.hidden = false; setPicker(false); setTimeout(function(){ sel.focus(); }, 30); }
    function close(){ wrap.hidden = true; if(opener){ try{ opener.focus(); }catch(e){} } }
    btn.addEventListener('click', function(e){ e.stopPropagation(); open(); });
    if('speechSynthesis' in window) speechSynthesis.addEventListener('voiceschanged', function(){ if(!wrap.hidden) fill(); });
    sel.addEventListener('change', function(){ FX.setPref('voiceName', sel.value); FX.speak(FX.line('start',{name:'Robin', amt:'fifty'}), 0, true); });
    rate.addEventListener('input', function(){ FX.setPref('rate', +rate.value); document.getElementById('rateVal').textContent = (+rate.value).toFixed(2)+'×'; });
    pitch.addEventListener('input', function(){ FX.setPref('pitch', +pitch.value); document.getElementById('pitchVal').textContent = (+pitch.value).toFixed(2)+'×'; });
    document.getElementById('voiceTest').addEventListener('click', function(){ FX.speak(FX.line('start',{name:'Robin', amt:'fifty'}), 0, true); });
    document.getElementById('voiceDone').addEventListener('click', close);
    document.getElementById('voiceScrim').addEventListener('click', close);
    window.addEventListener('keydown', function(e){ if(e.key==='Escape' && !wrap.hidden){ e.stopImmediatePropagation(); close(); } }, true);
  })();
  var saved = 'mt'; try{ saved = localStorage.getItem('gamenight-game') || 'mt'; }catch(e){}
  pickGame(GAMES[saved] ? saved : 'mt');

  // ===== Install support (works on your own site, e.g. GitHub Pages) =====
  if('serviceWorker' in navigator && location.protocol==='https:' && !/claude\.ai|claudeusercontent/.test(location.hostname)){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
})();
</script>
</body>
</html>
