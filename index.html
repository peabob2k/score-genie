<style>
body{margin:0;background:#173b2c}
.bar{background:#173b2c;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px;display:flex;justify-content:center}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:rgba(0,0,0,.28);border-radius:999px;padding:3px;width:100%;max-width:480px}
.seg button{border:0;background:transparent;color:#f4efe4;font:600 12px/1 Barlow,system-ui,-apple-system,sans-serif;padding:7px 4px;white-space:nowrap;border-radius:999px;cursor:pointer}
.seg button[aria-selected="true"]{background:#fbf8f2;color:#1d1b19}
.seg button:focus-visible{outline:3px solid #e9c46a;outline-offset:2px}
.host{display:block}
.host[hidden]{display:none!important}
@media print{.bar{display:none!important} body{background:#fff}}
</style>
</head>
<body>
<div class="bar">
  <div class="seg" role="tablist" aria-label="Which game">
    <button type="button" role="tab" data-game="mt" aria-selected="true">Mexican Train</button>
    <button type="button" role="tab" data-game="hf" aria-selected="false">Hand &amp; Foot</button>
    <button type="button" role="tab" data-game="oh" aria-selected="false">Oh Heck</button>
    <button type="button" role="tab" data-game="golf" aria-selected="false">Golf</button>
  </div>
</div>
<div class="host" id="host-mt"></div>
<div class="host" id="host-hf" hidden></div>
<div class="host" id="host-oh" hidden></div>
<div class="host" id="host-golf" hidden></div>

<template id="tpl-mt"><style>
:host{
  --bg:#E4ECE7; --surface:#FFFFFF; --ink:#14302A; --muted:#5B7169; --line:#C9D7D0;
  --felt:#1F6B52; --felt-ink:#FFFFFF; --tile:#FBFAF6; --tile-ink:#14302A; --pip:#B3261E;
  --gold:#E0A526; --gold-soft:#FBEFCF; --now:#D7EBE1;
  --shadow:0 1px 0 rgba(20,48,42,.12), 0 2px 6px rgba(20,48,42,.08);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :host{
    --bg:#0E211B; --surface:#16302A; --ink:#E7F0EB; --muted:#93AAA1; --line:#284840;
    --felt:#2E8F6E; --felt-ink:#FFFFFF; --tile:#EDEBE3; --tile-ink:#14302A; --pip:#B3261E;
    --gold:#E9B444; --gold-soft:#3A3318; --now:#1D3D34;
    --shadow:0 1px 0 rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:host([data-theme="dark"]){
  --bg:#0E211B; --surface:#16302A; --ink:#E7F0EB; --muted:#93AAA1; --line:#284840;
  --felt:#2E8F6E; --felt-ink:#FFFFFF; --tile:#EDEBE3; --tile-ink:#14302A; --pip:#B3261E;
  --gold:#E9B444; --gold-soft:#3A3318; --now:#1D3D34;
  --shadow:0 1px 0 rgba(0,0,0,.4);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.app{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-family:"Barlow Condensed",Barlow,system-ui,sans-serif;font-variant-numeric:tabular-nums}

.wrap{max-width:560px;margin:0 auto;padding:8px 14px 140px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px}
h1{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:20px;line-height:1;margin:0;letter-spacing:.2px}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:500;font-size:12px;color:var(--muted)}

.grid{display:grid;grid-template-columns:64px repeat(3,1fr);gap:6px;align-items:stretch}
.names input{width:100%;min-width:0;border:none;border-bottom:2px solid var(--line);background:transparent;padding:6px 2px;font-weight:600;font-size:17px;text-align:center;border-radius:0}
.names input:focus{outline:none;border-bottom-color:var(--felt)}
.names{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:6px 0 8px}
.app::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}

/* Round tile: a double domino */
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;width:40px;margin:0 auto;background:var(--tile);color:var(--tile-ink);border-radius:7px;box-shadow:inset 0 0 0 1.5px rgba(20,48,42,.35);height:100%;min-height:58px}
.tile span{flex:1;display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;line-height:1;width:100%}
.tile i{display:block;width:70%;height:1.5px;background:rgba(20,48,42,.35)}
.row.now .tile{box-shadow:inset 0 0 0 2px var(--pip)}
.row.now .tile span{color:var(--pip)}

.cell{width:100%;min-height:58px;border:none;border-radius:10px;background:var(--surface);box-shadow:var(--shadow);font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.cell small{font-family:Barlow,sans-serif;font-size:11px;font-weight:500;color:var(--muted);margin-top:3px}
.cell.empty{color:var(--muted);font-size:15px;font-weight:500;font-family:Barlow,sans-serif;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.row.now .cell.empty{background:var(--now);box-shadow:none;color:var(--ink)}
.cell.zero{color:var(--felt)}
.row{margin-bottom:6px}

/* Totals */
.totals{position:fixed;left:0;right:0;bottom:0;background:var(--felt);color:var(--felt-ink);padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:20}
.totals .grid{max-width:532px;margin:0 auto}
.totals .lbl{font-size:13px;font-weight:500;align-self:center;text-align:center;opacity:.85;line-height:1.15}
.tot{text-align:center;border-radius:10px;padding:6px 2px}
.tot b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:32px;font-weight:700;line-height:1}
.tot span{display:block;font-size:12px;opacity:.85;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tot.lead{background:var(--gold);color:#2A1E00}
.tot.lead span{opacity:1}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(6,20,16,.5);z-index:30;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:18px 18px 0 0;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;transform:translateY(105%);transition:transform .22s ease;max-height:92vh;overflow:auto}
.open .scrim{display:block}
.open .sheet{transform:none}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sheet h2{margin:0;font-size:15px;font-weight:600}
.sheet .sub{color:var(--muted);font-size:13px}
.readout{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 2px;border-bottom:1px solid var(--line);padding-bottom:6px}
.readout b{font-family:"Barlow Condensed",sans-serif;font-size:40px;font-weight:700;line-height:.9}
.trail{color:var(--muted);font-size:14px;text-align:right;flex:1;min-height:20px;overflow-wrap:anywhere}
.hint{font-size:13px;color:var(--muted);margin:0}
.view{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 8px}
.seg{display:inline-flex;flex-shrink:0;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:none;background:none;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--felt);color:var(--felt-ink)}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.half{aspect-ratio:1/1;border:none;border-radius:10px;background:var(--tile);color:var(--tile-ink);box-shadow:inset 0 0 0 1.5px rgba(20,48,42,.3),0 2px 0 rgba(20,48,42,.18);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px}
.half:active{transform:translateY(1px);box-shadow:inset 0 0 0 1.5px rgba(20,48,42,.3)}
.half.blank{font-size:15px;font-weight:600}
.half small{display:block;font-family:Barlow,sans-serif;font-size:11px;font-weight:500;opacity:.7;margin-top:2px}
.half{position:relative}
.half svg{display:block;width:66%;height:66%;margin:auto;transform:translateY(10%)}
.half .corner{position:absolute;top:3px;left:5px;font-family:"Barlow Condensed",sans-serif;font-size:16px;font-weight:700;line-height:1;opacity:.75}
.half svg circle{fill:var(--tile-ink)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tools button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 6px;font-weight:500;font-size:15px}
.typed{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--muted)}
.typed input{flex:1;min-width:0;border:1px solid var(--line);background:transparent;border-radius:10px;padding:9px 12px;font-size:17px;color:var(--ink)}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:14px}
.actions button{border:none;border-radius:12px;padding:14px;font-weight:600;font-size:16px}
.cancel{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.save{background:var(--felt);color:var(--felt-ink)}
.out{display:block;width:100%;margin-top:8px;border:none;border-radius:12px;padding:12px;font-weight:600;background:var(--now);color:var(--ink)}
.clearscore{display:block;margin:10px auto 0;background:none;border:none;color:var(--pip);font-size:14px;font-weight:500;padding:6px}

.done{margin:14px 0 0;padding:14px;border-radius:12px;background:var(--gold-soft);text-align:center;font-weight:600;display:none}

.hbtns{display:flex;gap:6px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--line);border-radius:999px;padding:3px;margin:4px 0 10px}
.tab{border:none;background:transparent;border-radius:999px;padding:7px 6px;font-weight:600;font-size:14px;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--felt);color:var(--felt-ink)}
.gmenu{position:relative}
.gmenu-list{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.22),0 0 0 1px var(--line);min-width:240px;padding:4px;display:flex;flex-direction:column}
.gmenu-list[hidden]{display:none}
.gmenu-list button{appearance:none;border:none;background:none;text-align:left;padding:10px 12px;border-radius:8px;font:600 15px Barlow,system-ui,sans-serif;color:var(--ink);cursor:pointer}
.gmenu-list button small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.gmenu-list button:hover:not(:disabled){background:var(--now)}
.gmenu-list button:disabled{opacity:.4;cursor:default}
.gmenu-list button:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.gmenu-list .danger{color:var(--pip)}

[hidden]{display:none!important}

    if(isComplete(S)){
      var w = winnersOf(S).map(function(p){ return S.names[p]; });
      $('doneText').textContent = (w.length>1 ? 'Tie game: '+w.join(' and ')+' with '+fmtN(min)+'.' : w[0]+' wins with '+fmtN(min)+'.') + ' Saved to History.';
      done.style.display = 'block';
    } else done.style.display = 'none';
  }

  // ----- Score sheet: tap the cards left in front of the player -----
  var editing = null, picks = [], labels = [], lastFocus = null;
  function sum(){ return picks.reduce(function(a,b){ return a+b; },0); }
  function addPick(v, l){ picks.push(v); labels.push(l); $('typed').value = ''; updateReadout(); }
  function updateReadout(){
    var typed = $('typed').value;
    $('readout').textContent = fmtN(typed!=='' ? (parseInt(typed,10)||0) : sum());
    $('trail').textContent = typed!=='' ? 'Typed' : labels.join(' + ');
  }
  function buildPad(){
    var rl = S.rules, pad = $('pad');
    pad.innerHTML = '';
    cardVals(rl).forEach(function(c){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'half' + (c[0]==='Joker' ? ' joker' : '');
      var special = c[0]==='2' || c[0]==='K' || c[0]==='Joker' || c[0]==='J' || c[0]==='Q' || c[0]==='A';
      b.innerHTML = '<span class="rk">'+c[0]+'</span>' + (special ? '<small'+(c[1]<0?' class="neg"':'')+'>'+fmtN(c[1])+'</small>' : '');
      b.setAttribute('aria-label', 'Add '+c[0]+', '+c[1]);
      b.addEventListener('click', function(){ addPick(c[1], c[0]); });
      pad.appendChild(b);
    });
    if(rl.caller!=='none'){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'half blank';
      b.innerHTML = 'Caller<small>'+(rl.caller==='double' ? '×2' : '+10')+'</small>';
      b.setAttribute('aria-label', 'Caller penalty');
      b.addEventListener('click', function(){
        if(rl.caller==='double'){ var s = sum(); if(s>0) addPick(s, '×2'); }
        else addPick(10, 'penalty');
      });
      pad.appendChild(b);
    }
    $('hint').textContent = 'Tap every card left in front of the player. Skip matched pairs in a column; they score 0.' +
      (rl.caller!=='none' ? ' If they went out and didn’t have the lowest score, tap Caller last.' : '');
  }
  function openSheet(h, p){
    editing = {h:h, p:p}; picks = []; labels = []; lastFocus = R.activeElement;
    var v = S.holes[h][p];
    $('typed').value = v==null ? '' : v;
    $('sheetTitle').textContent = S.names[p];
    $('sheetSub').textContent = 'Hole '+(h+1);
    $('erase').style.display = v==null ? 'none' : 'block';
    updateReadout();
    $('sheetWrap').classList.add('open');
    setTimeout(function(){ $('save').focus(); }, 50);
  }
  function closeSheet(){ $('sheetWrap').classList.remove('open'); editing = null; if(lastFocus){ try{ lastFocus.focus(); }catch(e){} } }
  function commit(v){
    if(!editing) return;
    S.holes[editing.h][editing.p] = v;
    save(); closeSheet(); render();
  }
  $('undo').addEventListener('click', function(){ picks.pop(); labels.pop(); updateReadout(); });
  $('reset').addEventListener('click', function(){ picks = []; labels = []; $('typed').value = ''; updateReadout(); });
  $('typed').addEventListener('input', updateReadout);
  $('sign').addEventListener('click', function(){
    var t = $('typed'), v = t.value!=='' ? (parseInt(t.value,10)||0) : sum();
    t.value = String(-v); updateReadout();
  });
  $('save').addEventListener('click', function(){
    var typed = $('typed').value;
    commit(typed!=='' ? (parseInt(typed,10)||0) : sum());
  });
  $('erase').addEventListener('click', function(){ commit(null); });
  $('cancel').addEventListener('click', closeSheet);
  $('scrim').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && editing) closeSheet();
    if(e.key==='Enter' && editing && R.activeElement===$('typed')) $('save').click();
  });

  // ----- Rules page -----
  function li(arr){ return arr.map(function(x){ return '<li>'+x+'</li>'; }).join(''); }
  function renderRules(){
    var rl = S.rules, six = rl.variant==='6';
    $('r-sum').innerHTML = '<b>This game:</b> '+esc(summaryOf(rl));
    $('r-setup').innerHTML = li((six ? [
      'Deal each player 6 cards face down in two rows of three.',
      'Each player flips any 2 of their cards face up.'
    ] : [
      'Deal each player 4 cards face down in a 2 × 2 square.',
      'Each player peeks once at the 2 cards nearest them, then leaves them face down.'
    ]).concat([
      'Put the rest face down as the stock and turn the top card over to start the discard pile.' + (rl.jokers!=='none' ? ' Shuffle the jokers in.' : ''),
      'With 5 or more players, shuffle two decks together.'
    ]));
    $('r-turn').innerHTML = li(six ? [
      'Draw the top card of the stock or the discard pile.',
      'Swap it for any one of your cards, face up, and discard the card you replaced.',
      'Or, if you drew from the stock, discard it and flip one of your face-down cards.'
    ] : [
      'Draw the top card of the stock or the discard pile.',
      'Swap it for any one of your cards, face down, and discard the card you replaced.',
      'Or, if you drew from the stock, just discard it.',
      'Instead of drawing, you can knock to end the hole.'
    ]);
    $('r-end').innerHTML = li((six ? [
      'When someone has all 6 cards face up, everyone else gets one more turn.',
      'Then everyone turns over any face-down cards and scores.'
    ] : [
      'After someone knocks, everyone else gets one more turn.',
      'Then everyone turns over their cards and scores.'
    ]).concat(rl.caller==='double' ? ['If the player who ended the hole doesn’t have the lowest score, their score for the hole is doubled.']
      : rl.caller==='10' ? ['If the player who ended the hole doesn’t have the lowest score, they add 10.'] : []));
    var rows = [['Ace','1'],['2',fmtN(+rl.twos)],['3 through 10','Face value'],['Jack or Queen','10'],['King',rl.kings]];
    if(rl.jokers!=='none') rows.push(['Joker',fmtN(+rl.jokers)]);
    rows.push(['Matching pair in a column','0 for both']);
    $('r-scoretable').innerHTML = rows.map(function(x){ return '<tr><td>'+x[0]+'</td><td>'+x[1]+'</td></tr>'; }).join('');
    $('r-scorenote').textContent = 'Lowest total after '+rl.holes+' holes wins.';
  }

  // ----- Game menu -----
  var menuBtn = $('gameMenuBtn'), menu = $('gameMenu'), menuWrap = menuBtn.parentNode;
  function setMenu(open){
    menu.hidden = !open; menuBtn.setAttribute('aria-expanded', String(open));
    if(open){ var has = hasData(S); $('endGame').disabled = !has || isComplete(S); $('clearGame').disabled = !has; }
  }
  menuBtn.addEventListener('click', function(){ setMenu(menu.hidden); });
  menu.addEventListener('click', function(e){ if(e.target.closest('button')) setMenu(false); });
  window.addEventListener('click', function(e){ if(!menu.hidden && e.composedPath().indexOf(menuWrap)===-1) setMenu(false); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && !menu.hidden){ setMenu(false); menuBtn.focus(); } });

  function startFresh(names, rl){ S = fresh(names, rl); save(); buildNames(); buildPad(); render(); renderRules(); }
  $('endGame').addEventListener('click', function(){
    var t = totalsOf(S), w = winnersOf(S);
    var who = w.length>1 ? w.map(function(p){ return S.names[p]; }).join(' and ')+' tie' : S.names[w[0]]+' wins';
    if(!confirm('End the game now? '+who+' with '+fmtN(t[w[0]])+'.')) return;
    syncHistory();
    var h = loadH(); h.forEach(function(g){ if(g.id===S.id){ g.complete = true; g.endedEarly = true; } }); saveH(h);
    startFresh(S.names, S.rules); showView('history');
  });
  $('clearGame').addEventListener('click', function(){
    if(!confirm('Clear this game? Its scores won’t be saved to History.')) return;
    saveH(loadH().filter(function(g){ return g.id!==S.id; }));
    startFresh(S.names, S.rules);
  });

  var setup = SETUP(R, {
    houseKey:'golf-house', defaults:G_DEFAULTS, official:official, minPlayers:2, maxPlayers:8,
    vars:'--su-bg:var(--surface);--su-ink:var(--ink);--su-muted:var(--muted);--su-line:var(--line);--su-accent:var(--felt);--su-chip:var(--now)',
    defaultName:function(i){ return 'Player '+(i+1); },
    schema:[
      {key:'variant', label:'Game', choices:[['6','6-card Golf'],['4','4-card Golf']]},
      {key:'holes', label:'Holes', choices:[['9','9'],['18','18']]},
      {key:'twos', label:'2s', choices:[['-2','−2'],['2','2']]},
      {key:'kings', label:'Kings', choices:[['0','0'],['10','10']]},
      {key:'jokers', label:'Jokers', choices:[['none','Not used'],['-2','−2'],['-5','−5']]},
      {key:'caller', label:'Player who ends the hole doesn’t have the lowest', choices:[['none','No penalty'],['double','Double their score'],['10','+10']]}
    ],
    note:function(names, rl){ return names.length>=5 ? 'With '+names.length+' players, shuffle two decks together.' : ''; },
    onStart:function(names, rl){ startFresh(names, rl); showView('score'); },
    onSave:function(names, rl){
      var id = S.id, st = S.started;
      S = fresh(names, rl); S.id = id; S.started = st;
      save(); buildNames(); buildPad(); render(); renderRules();
    }
  });
  $('newGame').addEventListener('click', function(){ setup.open('new', {names:S.names, rules:S.rules, hasScores:hasData(S)}); });
  $('houseRules').addEventListener('click', function(){ setup.open(hasData(S) ? 'view' : 'edit', {names:S.names, rules:S.rules}); });

  // ----- History -----
  function gameTable(g){
    var t = totalsOf(g);
    var h = '<div class="tscroll"><table class="gt"><thead><tr><th>Hole</th>' +
      g.names.map(function(nm){ return '<th>'+esc(nm)+'</th>'; }).join('') + '</tr></thead><tbody>';
    g.holes.forEach(function(row, i){
      h += '<tr><td>'+(i+1)+'</td>' + row.map(function(v){ return '<td>'+(v==null ? '–' : fmtN(v))+'</td>'; }).join('') + '</tr>';
    });
    return h + '</tbody><tfoot><tr><td>Total</td>' + t.map(function(v){ return '<td>'+fmtN(v)+'</td>'; }).join('') + '</tr></tfoot></table></div>';
  }
  function resultLine(g){
    if(!g.complete) return 'Unfinished game.';
    var t = totalsOf(g), w = winnersOf(g);
    return (g.endedEarly ? 'Ended early. ' : '') + (w.length>1 ? 'Tie: '+w.map(function(p){ return g.names[p]; }).join(' and ') : 'Winner: '+g.names[w[0]]) + ' (' + fmtN(t[w[0]]) + ')';
  }
  function sortedH(){ return loadH().sort(function(a,b){ return b.started.localeCompare(a.started); }); }
  function renderHistory(){
    var list = $('historyList'), h = sortedH();
    list.innerHTML = '';
    $('printAll').disabled = $('downloadCsv').disabled = !h.length;
    if(!h.length){ list.innerHTML = '<p class="empty-h">No games yet. Games save here automatically as you play.</p>'; return; }
    h.forEach(function(g){
      var t = totalsOf(g), w = winnersOf(g), rl = rulesOf(g);
      var d = document.createElement('details'); d.className = 'game';
      d.innerHTML = '<summary><div class="gmeta"><span>'+esc(gameName(rl))+' · '+esc(fmtDate(g.started))+'</span>' +
        (g.endedEarly ? '<span class="tag">Ended early</span>' : g.complete ? '' : '<span class="tag">'+(g.id===S.id ? 'In progress' : 'Unfinished')+'</span>') + '</div>' +
        '<div class="gtots" style="grid-template-columns:repeat('+g.names.length+',minmax(0,1fr))">' + t.map(function(v,p){
          return '<div class="'+(g.complete && w.indexOf(p)>-1 ? 'win' : '')+'"><b>'+fmtN(v)+'</b><span>'+esc(g.names[p])+'</span></div>';
        }).join('') + '</div></summary>' +
        '<div class="gbody"><p class="grules">Rules: '+esc(summaryOf(rl))+'</p>' + gameTable(g) +
        '<div class="gactions"><button class="btn alt" type="button" data-print>Print this game</button>' +
        '<button class="btn warn" type="button" data-delete>Delete</button></div></div>';
      d.querySelector('[data-print]').addEventListener('click', function(){ printGames([g]); });
      d.querySelector('[data-delete]').addEventListener('click', function(){
        if(!confirm('Delete this game from History?')) return;
        saveH(loadH().filter(function(x){ return x.id!==g.id; }));
        if(g.id===S.id){ S = fresh(S.names, S.rules); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} render(); }
        renderHistory();
      });
      list.appendChild(d);
    });
  }
  function printGames(games){
    $('printArea').innerHTML = '<h1>Golf scores</h1>' + games.map(function(g){
      return '<section class="pgame"><h2>'+esc(gameName(rulesOf(g)))+' · '+esc(fmtDate(g.started))+'</h2><p>Rules: '+esc(summaryOf(rulesOf(g)))+'</p>'+gameTable(g)+'<p>'+esc(resultLine(g))+'</p></section>';
    }).join('');
    window.print();
  }
  function csvCell(v){ v = String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
  function downloadCsv(){
    var lines = [];
    sortedH().forEach(function(g){
      var t = totalsOf(g), rl = rulesOf(g);
      lines.push(['Game', gameName(rl), fmtDate(g.started), g.endedEarly ? 'Ended early' : g.complete ? 'Complete' : 'Unfinished'].map(csvCell).join(','));
      lines.push(['Rules', summaryOf(rl)].map(csvCell).join(','));
      lines.push(['Hole'].concat(g.names).map(csvCell).join(','));
      g.holes.forEach(function(row, i){ lines.push([i+1].concat(row.map(function(v){ return v==null ? '' : v; })).map(csvCell).join(',')); });
      lines.push(['Total'].concat(t).map(csvCell).join(','));
      lines.push('');
    });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join('\n')], {type:'text/csv'}));
    a.download = 'golf-history-' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }

  var VIEWS = ['rules','score','history'];
  function showView(v){
    VIEWS.forEach(function(k){
      $('t-'+k).setAttribute('aria-selected', String(k===v));
      $('v-'+k).hidden = k!==v;
    });
    $('totalsBar').hidden = v!=='score';
    if(v==='history') renderHistory();
    try{ localStorage.setItem('golf-tab', v); }catch(e){}
    window.scrollTo(0,0);
  }
  VIEWS.forEach(function(k){ $('t-'+k).addEventListener('click', function(){ showView(k); }); });
  $('printAll').addEventListener('click', function(){ printGames(sortedH()); });
  $('downloadCsv').addEventListener('click', downloadCsv);

  buildNames();
  buildPad();
  syncHistory();
  render();
  renderRules();
  var t0 = 'rules'; try{ t0 = localStorage.getItem('golf-tab') || 'rules'; }catch(e){}
  showView(VIEWS.indexOf(t0)>-1 ? t0 : 'rules');
})();

 })(rootGolf); }catch(e){ console.error('Golf failed to start', e); }

  // ===== Game selector =====
  var tabs = document.querySelectorAll('.seg button');
  function pickGame(g){
    tabs.forEach(function(b){ b.setAttribute('aria-selected', String(b.dataset.game===g)); });
    document.getElementById('host-mt').hidden = g!=='mt';
    document.getElementById('host-hf').hidden = g!=='hf';
    document.getElementById('host-oh').hidden = g!=='oh';
    document.getElementById('host-golf').hidden = g!=='golf';
    try{ localStorage.setItem('gamenight-game', g); }catch(e){}
    window.scrollTo(0,0);
  }
  tabs.forEach(function(b){ b.addEventListener('click', function(){ pickGame(b.dataset.game); }); });
  var saved = 'mt'; try{ saved = localStorage.getItem('gamenight-game') || 'mt'; }catch(e){}
  pickGame(['hf','oh','golf'].indexOf(saved)>-1 ? saved : 'mt');
})();
</script>
</body>
</html>
